              smtp_status_class: "5.7"
              service_namespace: example.invalid
              club: example
              severity: page
            exp_annotations:
              summary: "example.invalid: invoice mail rejected by Amazon SES (yahoo recipient, SMTP 5.7)"
              description: "Amazon SES reported 2 invoice message(s) as rejected in the last hour (recipient domain class yahoo, SMTP status class 5.7). Exact recipient domain, SMTP status and diagnostic: just prod-query \"SELECT e.event_at, s.kind, e.event_type, e.bounce_type, e.bounce_subtype, e.recipient_domain, e.smtp_status, e.diagnostic, e.remote_mta, s.related_type, s.related_id, s.user_id FROM mail_delivery_events e LEFT JOIN email_sends s ON s.id = e.send_id WHERE e.event_type IN ('bounce', 'complaint', 'reject', 'rendering_failure') AND e.received_at > now() - interval '24 hours' ORDER BY e.event_at DESC LIMIT 20\""
              runbook_url: "https://example.invalid/runbook#sesdeliveryfailed"

  # A series older than the hour that resets on an API restart and then
  # counts again still pages; one that only went on existing doesn't.
  - interval: 1m
    input_series:
      - series: 'brygge_email_delivery_total{job="example.invalid/brygge-api", kind="magic_link", result="rejected", recipient_domain_class="other", smtp_status_class="5.1"}'
        values: '3x70 0x5 1x30'
      - series: 'brygge_email_delivery_total{job="example.invalid/brygge-api", kind="invoice", result="rejected", recipient_domain_class="other", smtp_status_class="5.1"}'
        values: '2x110'
    alert_rule_test:
      - eval_time: 80m
        alertname: SesDeliveryFailed
        exp_alerts:
          - exp_labels:
              kind: magic_link
              result: rejected
              recipient_domain_class: other
              smtp_status_class: "5.1"
              service_namespace: example.invalid
              club: example
              severity: page
            exp_annotations:
              summary: "example.invalid: magic_link mail rejected by Amazon SES (other recipient, SMTP 5.1)"
              description: "Amazon SES reported 1 magic_link message(s) as rejected in the last hour (recipient domain class other, SMTP status class 5.1). Exact recipient domain, SMTP status and diagnostic: just prod-query \"SELECT e.event_at, s.kind, e.event_type, e.bounce_type, e.bounce_subtype, e.recipient_domain, e.smtp_status, e.diagnostic, e.remote_mta, s.related_type, s.related_id, s.user_id FROM mail_delivery_events e LEFT JOIN email_sends s ON s.id = e.send_id WHERE e.event_type IN ('bounce', 'complaint', 'reject', 'rendering_failure') AND e.received_at > now() - interval '24 hours' ORDER BY e.event_at DESC LIMIT 20\""
              runbook_url: "https://example.invalid/runbook#sesdeliveryfailed"

  # Report sync: a success at minute 10 (last_success = 600), exported every
  # 10 minutes. Fresh: quiet. 36h10m after the success the condition holds,
  # firing after `for: 30m`. A new success at 38h resolves it once
  # keep_firing_for (30m) has run out.
  - interval: 10m
    input_series:
      - series: 'brygge_vipps_report_sync_last_success_seconds{job="example.invalid/brygge-api", msn="100001"}'
        values: '600x227 136800x70'
      - series: 'brygge_email_send_total{job="example.invalid/brygge-api", kind="other", result="ok"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 1h
        alertname: VippsReportSyncStale
        exp_alerts: []
      - eval_time: 36h30m
        alertname: VippsReportSyncStale
        exp_alerts: []
      - eval_time: 37h
        alertname: VippsReportSyncStale
        exp_alerts:
          - exp_labels:
              msn: "100001"
              service_namespace: example.invalid
              club: example
              severity: warn
            exp_annotations:
              summary: "example.invalid: no successful Vipps report sync for 36 hours"
              description: "The Vipps Report API pull for merchant 100001 has not succeeded for more than 36 hours, or not since the API started. Nothing new from Vipps reaches Tildel, and days older than 4 are never pulled again by the job; booking what is already in Brygge still runs."
              runbook_url: "https://example.invalid/runbook#vippsreportsyncstale"
      - eval_time: 38h40m
        alertname: VippsReportSyncStale
        exp_alerts: []

  # A restart 30h after the last success whose pulls keep failing: the
  # series is absent from then on, but the last value still counts, so the
  # alert fires 36h after the success, not 36h after the restart. Three
  # days after the last sample (102h) the absent branch takes over, with the
  # job label instead of the msn: keep_firing_for holds the msn alert through
  # the job alert's `for` (102h15m), and from 102h30m only the job alert
  # fires.
  - interval: 10m
    input_series:
      - series: 'brygge_vipps_report_sync_last_success_seconds{job="example.invalid/brygge-api", msn="100001"}'
        values: '600x180'
      - series: 'brygge_email_send_total{job="example.invalid/brygge-api", kind="other", result="ok"}'
        values: '0x700'
    alert_rule_test:
      - eval_time: 35h
        alertname: VippsReportSyncStale
        exp_alerts: []
      - eval_time: 37h
        alertname: VippsReportSyncStale
        exp_alerts:
          - exp_labels:
              msn: "100001"
              service_namespace: example.invalid
              club: example
              severity: warn
            exp_annotations:
              summary: "example.invalid: no successful Vipps report sync for 36 hours"
              description: "The Vipps Report API pull for merchant 100001 has not succeeded for more than 36 hours, or not since the API started. Nothing new from Vipps reaches Tildel, and days older than 4 are never pulled again by the job; booking what is already in Brygge still runs."
              runbook_url: "https://example.invalid/runbook#vippsreportsyncstale"
      - eval_time: 101h
        alertname: VippsReportSyncStale
        exp_alerts:
          - exp_labels:
              msn: "100001"
              service_namespace: example.invalid
              club: example
              severity: warn
            exp_annotations:
              summary: "example.invalid: no successful Vipps report sync for 36 hours"
              description: "The Vipps Report API pull for merchant 100001 has not succeeded for more than 36 hours, or not since the API started. Nothing new from Vipps reaches Tildel, and days older than 4 are never pulled again by the job; booking what is already in Brygge still runs."
              runbook_url: "https://example.invalid/runbook#vippsreportsyncstale"
      - eval_time: 102h15m
        alertname: VippsReportSyncStale
        exp_alerts:
          - exp_labels:
              msn: "100001"
              service_namespace: example.invalid
              club: example
              severity: warn
            exp_annotations:
              summary: "example.invalid: no successful Vipps report sync for 36 hours"
              description: "The Vipps Report API pull for merchant 100001 has not succeeded for more than 36 hours, or not since the API started. Nothing new from Vipps reaches Tildel, and days older than 4 are never pulled again by the job; booking what is already in Brygge still runs."
              runbook_url: "https://example.invalid/runbook#vippsreportsyncstale"
      - eval_time: 103h
        alertname: VippsReportSyncStale
        exp_alerts:
          - exp_labels:
              job: example.invalid/brygge-api
              service_namespace: example.invalid
              club: example
              severity: warn
            exp_annotations:
              summary: "example.invalid: no successful Vipps report sync for 36 hours"
              description: "The Vipps Report API pull has not succeeded for more than 36 hours, or not since the API started. Nothing new from Vipps reaches Tildel, and days older than 4 are never pulled again by the job; booking what is already in Brygge still runs."
              runbook_url: "https://example.invalid/runbook#vippsreportsyncstale"

  # A start whose first pull fails, with no success on record: the absent
  # branch fires after `for`. While the whole API is silent it is
  # suppressed (ApiSilent fires instead).
  - interval: 1m
    input_series:
      - series: 'brygge_email_send_total{job="example.invalid/brygge-api", kind="other", result="ok"}'
        values: '0x60 _x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: VippsReportSyncStale
        exp_alerts: []
      - eval_time: 40m
        alertname: VippsReportSyncStale
        exp_alerts:
          - exp_labels:
              job: example.invalid/brygge-api
