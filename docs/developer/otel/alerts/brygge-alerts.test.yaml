          - exp_labels:
              service_namespace: example.invalid
              club: example
              severity: warn
            exp_annotations:
              summary: "example.invalid: 2 SES event(s) in the dead-letter queue"
              description: "The SES events dead-letter queue has held 2 message(s) for 15 minutes. Those delivery events failed five times and are not recorded; they are deleted 14 days after they were first sent."
              runbook_url: "https://example.invalid/runbook#sesdlqnotempty"

  # A new status-class series that counts twice inside its first hour
  # reports both.
  - interval: 1m
    input_series:
      - series: 'brygge_email_delivery_total{job="example.invalid/brygge-api", kind="invoice", result="rejected", recipient_domain_class="yahoo", smtp_status_class="5.7"}'
        values: '_x10 1x5 2x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: SesDeliveryFailed
        exp_alerts:
          - exp_labels:
              kind: invoice
              result: rejected
