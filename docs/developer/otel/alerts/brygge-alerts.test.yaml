      - expr: count(ALERTS{alertname="PaymentWebhookFailing", alertstate="firing"})
        eval_time: 175m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: count(ALERTS{alertname="PaymentWebhookFailing", alertstate="firing"})
        eval_time: 180m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: count(ALERTS{alertname="PaymentWebhookFailing", alertstate="firing"})
        eval_time: 185m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: count(ALERTS{alertname="PaymentWebhookFailing", alertstate="firing"})
        eval_time: 190m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: count(ALERTS{alertname="PaymentWebhookFailing", alertstate="firing"})
        eval_time: 195m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: count(ALERTS{alertname="PaymentWebhookFailing", alertstate="firing"})
        eval_time: 200m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: count(ALERTS{alertname="PaymentWebhookFailing", alertstate="firing"})
        eval_time: 205m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: count(ALERTS{alertname="PaymentWebhookFailing", alertstate="firing"})
        eval_time: 210m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: count(ALERTS{alertname="PaymentWebhookFailing", alertstate="firing"})
        eval_time: 215m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: count(ALERTS{alertname="PaymentWebhookFailing", alertstate="firing"})
        eval_time: 220m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: count(ALERTS{alertname="PaymentWebhookFailing", alertstate="firing"})
        eval_time: 225m
        exp_samples:
          - labels: '{}'
