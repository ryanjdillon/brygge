name: update-flake-lock

# Keeps flake inputs (esp. nixpkgs) current so a stale pin never silently rots.
# The 2026 crates.io User-Agent block broke deploy-rs's from-source build only
# because nixpkgs was ~5 months old and predated the static.crates.io fetcher
# fix; a weekly bump would have carried that fix in long before it bit a deploy.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

# The PR is opened with a GitHub App token, not GITHUB_TOKEN, so the job's own
# token only needs to read the repo.
permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      # A PR opened with GITHUB_TOKEN doesn't trigger other workflows, so ci.yml's
      # nix-check would never validate the bump. An App token does, and unlike a
      # PAT it doesn't expire. Setup: docs/developer/deploy.md#automated-flakelock-updates.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          token: ${{ steps.app-token.outputs.token }}
          pr-title: "flake.lock: automated weekly update"
          commit-msg: "chore(flake): automated flake.lock update"
          pr-labels: |
            dependencies
            automated
