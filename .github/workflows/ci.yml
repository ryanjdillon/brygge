name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command just lint-go
      # lint-vue runs the project's eslint from node_modules.
      - run: nix develop --command bash -c 'cd frontend && npm ci'
      - run: nix develop --command just lint-vue

  # Builds the app THROUGH Nix (the flake's own nixpkgs), unlike the setup-go /
  # setup-node jobs. This is what actually validates a flake.lock bump — without
  # it, a stale or broken nixpkgs sails through CI and only fails at deploy time.
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Evaluate the flake (catches eval / lockfile breakage)
        run: nix flake check --no-build
      - name: Build the app on the flake's nixpkgs
        run: nix build .#brygge --print-build-logs

  test-go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brygge
          POSTGRES_PASSWORD: brygge
          POSTGRES_DB: brygge_test
        ports:
          - 5432:5432
        # A throwaway database: data on tmpfs, and durability turned off in
        # the step below. A crash loses nothing that matters.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U brygge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://brygge:brygge@localhost:5432/brygge_test?sslmode=disable&pool_max_conns=4
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # Every test commits into its own database; on a disposable server the
      # fsync and WAL-flush waits are pure cost. ALTER SYSTEM cannot run in a
      # transaction block, hence one -c per statement.
      - name: Turn off Postgres durability
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U brygge -d brygge_test -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"
      # covermode=set (the default without -race): atomic counters only matter
      # under the race detector, and the summary below reports statement
      # coverage, which set gives exactly.
      - name: Run tests with coverage
        run: cd backend && go test -timeout 20m -coverprofile=coverage.out -covermode=set ./...
      - name: Coverage summary
        run: |
          cd backend
          go tool cover -func=coverage.out | tail -1
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          echo "## Go Test Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY

  test-vue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run test

  security-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # G104 (unchecked errors) is excluded for the same reason errcheck is
      # off in .golangci.yml; see CONTRIBUTING.md.
      - name: Run gosec
        uses: securego/gosec@v2.30.0
        with:
          args: -exclude=G104 -exclude-dir=gen ./backend/...

  vuln-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: cd backend && govulncheck ./...

  audit-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm audit --audit-level=high

  scan-trivy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Generate OpenAPI spec and TypeScript types
        run: |
          cd backend && go run ./cmd/openapi/ > /tmp/brygge-openapi.json
          cd ../frontend && npx openapi-typescript /tmp/brygge-openapi.json -o src/types/api.d.ts
      - name: Check api.d.ts is up to date
        run: |
          if ! git diff --exit-code frontend/src/types/api.d.ts; then
            echo "::error::frontend/src/types/api.d.ts is out of date. Run 'just api-types' and commit the result."
            exit 1
          fi

  # Runs alongside the test jobs rather than after them: it consumes none of
  # their output, nothing deploys from its artifact (deploys build through
  # Nix), and each job is its own pass/fail check, so waiting only added the
  # build time to the end of every run.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      - run: cd backend && CGO_ENABLED=0 go build -o ../brygge ./cmd/api
      - uses: actions/upload-artifact@v7
        with:
          name: brygge
          path: brygge

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/check-docs.sh

  nix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check
